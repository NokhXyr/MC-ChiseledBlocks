plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

repositories {
    // Modrinth maven, limited to Modrinth artifacts. Used for development runtime mods only.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Plays the game like a player would (real key presses, menus, screenshots) and quits.
        // Uses its own game directory so it never touches a client already running from run/.
        clientTest {
            client()
            gameDirectory = project.file("run-clienttest")
            systemProperty "bitsmith.clientTest", "true"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        // The playtest again, with Sodium, Iris, ModernFix and the other compatibility mods loaded.
        clientCompat {
            client()
            gameDirectory = project.file("run-compat")
            systemProperty "bitsmith.clientTest", "true"
            systemProperty "bitsmith.compatTest", "true"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        // Chisels & Bits import, step 1: carve with Chisels & Bits itself and save a world.
        clientCnbSource {
            client()
            gameDirectory = project.file("run-cnb")
            systemProperty "bitsmith.clientTest", "true"
            systemProperty "bitsmith.playtest", "cnbSource"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        // Step 2: open a copy of that world with Bitsmith only and check every block.
        clientCnbMigrate {
            client()
            gameDirectory = project.file("run-cnb-migrate")
            systemProperty "bitsmith.clientTest", "true"
            systemProperty "bitsmith.playtest", "cnbMigrate"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        // Performance scenes (docs/PROFILING.md), with Bitsmith and then with Chisels & Bits.
        clientBench {
            client()
            gameDirectory = project.file("run-bench")
            systemProperty "bitsmith.clientTest", "true"
            systemProperty "bitsmith.playtest", "bench"
            systemProperty "bitsmith.bench.mod", "bitsmith"
            systemProperty "bitsmith.metrics", "true"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        clientBenchCnb {
            client()
            gameDirectory = project.file("run-bench-cnb")
            systemProperty "bitsmith.clientTest", "true"
            systemProperty "bitsmith.playtest", "bench"
            systemProperty "bitsmith.bench.mod", "cnb"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        // Multiplayer endurance: bot players and the real client carve the same blocks.
        clientSoak {
            client()
            gameDirectory = project.file("run-soak")
            systemProperty "bitsmith.clientTest", "true"
            systemProperty "bitsmith.playtest", "soak"
            // ./gradlew runClientSoak -PsoakMinutes=60 for the one hour run.
            systemProperty "bitsmith.soak.minutes", project.findProperty("soakMinutes") ?: "10"
            systemProperty "bitsmith.metrics", "true"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        // The admin panel used with the mouse and keyboard: search, chunk map, profiling, TP.
        clientAdmin {
            client()
            gameDirectory = project.file("run-admin")
            systemProperty "bitsmith.clientTest", "true"
            systemProperty "bitsmith.playtest", "admin"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        // The panel's permission nodes driven through a real LuckPerms, which only runs on a
        // dedicated server: start serverPerms, then clientPerms joins it and drives LuckPerms
        // from the server console over RCON.
        serverPerms {
            server()
            gameDirectory = project.file("run-perms-server")
            programArgument '--nogui'
        }

        clientPerms {
            client()
            gameDirectory = project.file("run-perms")
            systemProperty "bitsmith.clientTest", "true"
            systemProperty "bitsmith.playtest", "perms"
            programArguments.addAll "--width", "1280", "--height", "720"
        }

        gameTestServer {
            type = "gameTestServer"
            // Own directory: no development client mods, no clash with a running client.
            gameDirectory = project.file("run-gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // Mods dropped into the mods folder of the client runs only (not the game test server).
    devClientMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Third party mods for the compatibility test client only.
    compatClientMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    benchClientMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // LuckPerms for the permission test client only.
    permsClientMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    compatShaderpacks {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    // Development client mods only: never part of the mod jar or its published dependencies.
    devClientMods "maven.modrinth:pehkui:${pehkui_version}"
    compatClientMods "maven.modrinth:sodium:${sodium_version}"
    compatClientMods "maven.modrinth:iris:${iris_version}"
    compatClientMods "maven.modrinth:modernfix:${modernfix_version}"
    compatClientMods "maven.modrinth:ferrite-core:${ferritecore_version}"
    compatClientMods "maven.modrinth:lithium:${lithium_version}"
    compatClientMods "maven.modrinth:immediatelyfast:${immediatelyfast_version}"
    compatClientMods "maven.modrinth:entityculling:${entityculling_version}"
    compatClientMods "maven.modrinth:worldedit:${worldedit_version}"
    compatClientMods "maven.modrinth:create:${create_version}"
    compatClientMods "maven.modrinth:kubejs:${kubejs_version}"
    compatClientMods "maven.modrinth:rhino:${rhino_version}"
    compatClientMods "maven.modrinth:better-advanced-tooltips:${better_advanced_tooltips_version}"
    benchClientMods "maven.modrinth:spark:${spark_version}"
    permsClientMods "maven.modrinth:luckperms:${luckperms_version}"
    compatShaderpacks "maven.modrinth:complementary-reimagined:${complementary_version}@zip"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

// Runs the voxel core micro-benchmarks (pure Java, no game needed): ./gradlew benchmark
tasks.register('benchmark', Test) {
    description = 'Runs the voxel core micro-benchmarks.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    testLogging {
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Copies the development client mods into the mods folder of each client run. Copy, not Sync:
// other mods placed there by hand are left alone.
[client: 'run', clientTest: 'run-clienttest', clientCompat: 'run-compat'].each { runName, gameDir ->
    def install = tasks.register("installDevMods${runName.capitalize()}", Copy) {
        from configurations.devClientMods
        if (runName == 'clientCompat') {
            from configurations.compatClientMods
        }
        into file("${gameDir}/mods")
    }
    tasks.matching { it.name == "run${runName.capitalize()}" }.configureEach {
        dependsOn install
    }
}

// Options for the playtest client: muted, never paused when unfocused, no first launch screens.
def writePlaytestOptions = tasks.register('writePlaytestOptions') {
    def files = ['run-clienttest', 'run-compat', 'run-cnb', 'run-cnb-migrate', 'run-bench', 'run-bench-cnb', 'run-soak', 'run-admin', 'run-perms']
            .collect { file("$it/options.txt") }
    outputs.files(files)
    doLast {
        files.findAll { !it.exists() }.each { options ->
            options.parentFile.mkdirs()
            options.text = [
                    'onboardAccessibility:false',
                    'pauseOnLostFocus:false',
                    'narrator:0',
                    'soundCategory_master:0.0',
                    'guiScale:2',
                    'tutorialStep:none',
                    'skipMultiplayerWarning:true',
                    'joinedFirstServer:true',
                    // Performance settings of docs/PROFILING.md: render distance 12, no frame cap.
                    'renderDistance:12',
                    'simulationDistance:8',
                    'maxFps:260',
                    'enableVsync:false',
                    'graphicsMode:1',
                    'ao:true',
            ].join('\n') + '\n'
        }
    }
}
tasks.matching { it.name in ['runClientTest', 'runClientCompat', 'runClientCnbSource', 'runClientCnbMigrate',
                             'runClientBench', 'runClientBenchCnb', 'runClientSoak', 'runClientAdmin', 'runClientPerms'] }.configureEach {
    dependsOn writePlaytestOptions
}

// ModernFix's dynamic model loading is the setting most likely to break custom models, so the
// compatibility client always runs with it on.
def writeCompatConfig = tasks.register('writeCompatConfig') {
    def modernfix = file('run-compat/config/modernfix-mixins.properties')
    def iris = file('run-compat/config/iris.properties')
    // Captured as a file collection now: the configuration cache cannot reach `configurations` later.
    FileCollection shaderpacks = configurations.compatShaderpacks
    inputs.files(shaderpacks)
    outputs.files(modernfix, iris)
    doLast {
        modernfix.parentFile.mkdirs()
        if (!modernfix.exists() || !modernfix.text.contains('mixin.perf.dynamic_resources=true')) {
            modernfix.append('\nmixin.perf.dynamic_resources=true\n')
        }
        // Shaders on, with the test pack, so carved blocks are also checked through Iris.
        iris.text = "enableShaders=true\nshaderPack=${shaderpacks.singleFile.name}\n"
    }
}
def installCompatAssets = tasks.register('installCompatAssets', Copy) {
    into 'run-compat'
    from(configurations.compatShaderpacks) { into 'shaderpacks' }
    from('compat-test/kubejs') { into 'kubejs' }
}
tasks.matching { it.name == 'runClientCompat' }.configureEach {
    dependsOn writeCompatConfig, installCompatAssets
}

// Chisels & Bits 1.21.1 for the import test, from the official CurseForge CDN, checked by hash.
// Never part of the mod jar; used only by runClientCnbSource.
def cnbDownloads = [
        [file("run-cnb/mods/chisels-and-bits-neoforge-${cnb_version}.jar"), cnb_url, 'SHA-256', cnb_sha256],
        [file("run-cnb/mods/saecularia-caudices-neoforge-${saecularia_version}.jar"), saecularia_url, 'SHA-512', saecularia_sha512],
]
def installChiselsAndBits = tasks.register('installChiselsAndBits') {
    outputs.files(cnbDownloads.collect { it[0] })
    doLast {
        cnbDownloads.each { target, url, algorithm, expected ->
            if (!target.exists()) {
                target.parentFile.mkdirs()
                new URI(url).toURL().withInputStream { input -> target.withOutputStream { it << input } }
            }
            def actual = java.security.MessageDigest.getInstance(algorithm).digest(target.bytes).encodeHex().toString()
            if (actual != expected) {
                target.delete()
                throw new GradleException("Checksum mismatch for ${target.name}: ${actual}")
            }
        }
    }
}
tasks.matching { it.name == 'runClientCnbSource' }.configureEach {
    dependsOn installChiselsAndBits
}

// Copies the world saved by the source run, and the expected results, for the migration run.
def copyCnbWorld = tasks.register('copyCnbWorld', Sync) {
    from('run-cnb') {
        include 'saves/cnb-source/**'
        include 'cnb-expected.txt'
    }
    into 'run-cnb-migrate'
    preserve {
        include '**'
        exclude 'saves/cnb-source/**'
        exclude 'cnb-expected.txt'
    }
}
tasks.matching { it.name == 'runClientCnbMigrate' }.configureEach {
    dependsOn copyCnbWorld
}

// Saecularia Caudices nests the classes Chisels & Bits needs in a jar the development loader skips;
// for the test runs only, that nested jar is repacked as a game library.
def saeculariaJar = cnbDownloads[1][0]
def repackSaeculariaCore = tasks.register('repackSaeculariaCore', Jar) {
    dependsOn installChiselsAndBits
    archiveFileName = 'saecularia-caudices-core-gamelibrary.jar'
    destinationDirectory = layout.buildDirectory.dir('cnb-test')
    from({
        def nested = zipTree(saeculariaJar).matching { include 'META-INF/jarjar/*core*.jar' }.singleFile
        zipTree(nested).matching { exclude 'META-INF/MANIFEST.MF' }
    })
    manifest {
        attributes 'FMLModType': 'GAMELIBRARY', 'Automatic-Module-Name': 'saecularia_caudices_core'
    }
}
def installCnbRunMods = tasks.register('installCnbRunMods', Copy) {
    dependsOn installChiselsAndBits, repackSaeculariaCore
    from repackSaeculariaCore
    into 'run-cnb/mods'
}
tasks.matching { it.name == 'runClientCnbSource' }.configureEach {
    dependsOn installCnbRunMods
}

// Performance runs: Spark only, plus Chisels & Bits and its libraries for the comparison run.
def installBenchMods = tasks.register('installBenchMods', Copy) {
    from configurations.benchClientMods
    into 'run-bench/mods'
}
def installBenchCnbMods = tasks.register('installBenchCnbMods', Copy) {
    dependsOn installChiselsAndBits, repackSaeculariaCore, installCnbRunMods
    from configurations.benchClientMods
    from cnbDownloads.collect { it[0] }
    from repackSaeculariaCore
    into 'run-bench-cnb/mods'
}
// Permission test server: LuckPerms, offline mode for the development player, RCON on for the
// test client, and the development player ("Dev") as operator.
def installPermsMods = tasks.register('installPermsMods', Copy) {
    from configurations.permsClientMods
    into 'run-perms-server/mods'
}
def writePermsServerFiles = tasks.register('writePermsServerFiles') {
    def dir = file('run-perms-server')
    outputs.files(file('run-perms-server/eula.txt'), file('run-perms-server/server.properties'), file('run-perms-server/ops.json'))
    doLast {
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = [
                'online-mode=false',
                'server-port=25599',
                'enable-rcon=true',
                'rcon.port=25598',
                'rcon.password=bitsmith-playtest',
                'level-name=bitsmith-perms',
                'level-type=minecraft\\:flat',
                'gamemode=creative',
                'spawn-protection=0',
                'spawn-monsters=false',
                'view-distance=6',
        ].join('\n') + '\n'
        String devId = UUID.nameUUIDFromBytes('OfflinePlayer:Dev'.getBytes('UTF-8')).toString()
        new File(dir, 'ops.json').text = "[{\"uuid\":\"${devId}\",\"name\":\"Dev\",\"level\":4,\"bypassesPlayerLimit\":false}]\n"
    }
}
tasks.matching { it.name == 'runServerPerms' }.configureEach { dependsOn installPermsMods, writePermsServerFiles }
tasks.matching { it.name == 'runClientBench' }.configureEach { dependsOn installBenchMods }
tasks.matching { it.name == 'runClientBenchCnb' }.configureEach { dependsOn installBenchCnbMods }

// Spark's background profiler would run during the measurements: off in the performance runs.
def writeBenchConfig = tasks.register('writeBenchConfig') {
    def configs = ['run-bench', 'run-bench-cnb'].collect { file("$it/config/spark/config.json") }
    outputs.files(configs)
    doLast {
        configs.each { config ->
            config.parentFile.mkdirs()
            config.text = '{\n  "backgroundProfiler": false\n}\n'
        }
    }
}
tasks.matching { it.name in ['runClientBench', 'runClientBenchCnb'] }.configureEach {
    dependsOn writeBenchConfig
}
