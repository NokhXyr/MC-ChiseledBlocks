pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'chiseledblocks'

// Optional addon: bulk bit production with Create machines. Its own jar, never part of Chiseled Blocks.
include 'chiseledblocks-create'
